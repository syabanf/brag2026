# Frontend (Vite/nginx), API (Go) and PostgreSQL.
#
#   docker compose up --build

name: brag

services:
  frontend:
    build:
      context: ./frontend
      args:
        # Vite inlines this at build time, so it must point at the API URL as
        # the browser will see it — not the internal service name.
        VITE_API_URL: ${API_PUBLIC_URL:-http://localhost:8081}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./backend
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      DATABASE_URL: postgresql://brag:brag@db:5432/brag_dev
      # Cookies are credentialed, so the browser origin must be listed exactly.
      ALLOWED_ORIGINS: ${WEB_PUBLIC_URL:-http://localhost:5173}
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brag
      POSTGRES_PASSWORD: brag
      POSTGRES_DB: brag_dev
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata_rewrite:/var/lib/postgresql/data
      # Applied once, in filename order, when the volume is first created.
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brag -d brag_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata_rewrite:

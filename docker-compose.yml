# Frontend (Vite/nginx), API (Go) and PostgreSQL.
#
#   docker compose up --build

name: brag

services:
  frontend:
    build:
      context: ./frontend
      args:
        # Vite inlines this at build time, so it must point at the API URL as
        # the browser will see it — not the internal service name.
        VITE_API_URL: ${API_PUBLIC_URL:-http://localhost:8081}
        # This compose file runs the seeded demo, so the login screen offers
        # the demo personas. Set DEMO_SIGNIN=false to build without them.
        VITE_DEMO_SIGNIN: ${DEMO_SIGNIN:-true}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./backend
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      DATABASE_URL: postgresql://brag:brag@db:5432/brag_dev
      # Cookies are credentialed, so the browser origin must be listed exactly.
      ALLOWED_ORIGINS: ${WEB_PUBLIC_URL:-http://localhost:5173}
      COOKIE_SECURE: "false"
      # Concurrent database work. Keep the total across every api instance
      # below Postgres' max_connections (100 by default).
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      # Optional guided-tour voice-over. Set these in a local .env next to this
      # file; without them the tour narrates with the browser's own voice.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      # Narration is written here so a redeploy does not re-synthesise it. A
      # full tour is ~1,450 characters and a free plan allows 10,000 a month.
      TOUR_AUDIO_DIR: /var/lib/brag/tour-audio
    volumes:
      - tour_audio:/var/lib/brag/tour-audio
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brag
      POSTGRES_PASSWORD: brag
      POSTGRES_DB: brag_dev
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata_rewrite:/var/lib/postgresql/data
      # Applied once, in filename order, when the volume is first created.
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brag -d brag_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  tour_audio:
  pgdata_rewrite:

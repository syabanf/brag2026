stages:
  - verify
  - deploy

# Every push runs the same gates a developer runs locally, so a broken build
# is caught before it reaches main rather than on the server.

backend:
  stage: verify
  image: golang:1.26-alpine
  script:
    # The race detector needs cgo, which the alpine image does not ship.
    - apk add --no-cache gcc musl-dev
    - cd backend
    - gofmt -l . | tee /tmp/fmt && test ! -s /tmp/fmt
    - go vet ./...
    # -race catches the concurrency bugs the scoring tests are written to
    # find; -count=1 stops a cached PASS from hiding an intermittent one.
    - CGO_ENABLED=1 go test -race -count=1 ./...
    - go build -o /dev/null ./cmd/api
  rules:
    - changes: [backend/**/*]
    - if: $CI_COMMIT_BRANCH == "main"

frontend:
  stage: verify
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npx tsc -b --force
    - npm run lint
    - npm run build
  cache:
    key: { files: [frontend/package-lock.json] }
    paths: [frontend/node_modules]
  rules:
    - changes: [frontend/**/*]
    - if: $CI_COMMIT_BRANCH == "main"

secrets:
  stage: verify
  image: alpine:3.21
  script:
    - apk add --no-cache git bash
    - bash scripts/security-check.sh
  rules:
    - if: $CI_COMMIT_BRANCH

# Rebuilds the compose stack in place. The old script ran `npm ci` and
# restarted a pm2 process, which belonged to the Next.js app that no longer
# exists in this repository.
deploy-production:
  stage: deploy
  needs: [backend, frontend, secrets]
  only:
    - main
  script:
    - cd ~/brag2026
    - git pull origin main
    - docker compose up -d --build
    - docker compose ps
    - echo "Deploy selesai $(date)"
  environment:
    name: production
